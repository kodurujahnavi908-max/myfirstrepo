<!doctype html>
<html>
    <head>
        <title>Video and audio</title>
        <style>
            video{
                align-items: center;
                width:50%;
                border: 10px solid blue;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <video controls poster="kerala.jpg">
            <source src="video.mp4" type="video/mp4">
        </video>
        <div>
            <button onclick="playVideo()">Play Video</button>
            <button onclick="pauseVideo()">Pause Video</button>
            <button onclick="stop()">Stop Video</button>
        </div>
        <script>
            let videotag = document.querySelector("video");
            function playVideo(){
                videotag.play();
            }
            function pauseVideo(){
                videotag.pause();
            }
            function stop(){
                videotag.pause();
                videotag.currentTime=0;
            }
        </script>
    </body>
</html>
